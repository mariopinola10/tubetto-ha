name: Tubetto Server
version: "1.0.9"
slug: tubetto
description: YouTube e YouTube Music in tutta la casa, senza pubblicità, con Music Assistant
url: https://github.com/mariopinola10/tubetto-ha
arch:
  - aarch64
  - amd64
init: true
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:play-circle
panel_title: Tubetto
homeassistant_api: true
map:
  - share:rw
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Facoltativa, accesso diretto dalla rete di casa con chiave (di solito non serve)"
options:
  github_repo: mariopinola10/Tubetto
  github_token: ""
  audio_quality: high
  api_key: ""
  stream_base_url: ""
schema:
  github_repo: str
  github_token: password
  audio_quality: list(high|medium)
  api_key: password?
  stream_base_url: str?
